<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Raksha Bandhan ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #fff5f7, transparent 35%),
        radial-gradient(circle at bottom right, #ffe0ec, transparent 35%),
        linear-gradient(135deg, #fff1f5, #fff8e7);
      color: #5a2633;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px 60px;
    }

    .rakhi {
      font-size: 75px;
      animation: pulse 2s infinite;
    }

    h1 {
      margin: 5px 0;
      font-size: clamp(32px, 7vw, 52px);
      color: #c2185b;
    }

    .subtitle {
      font-size: 18px;
      color: #7b3f4c;
      margin: 10px auto 35px;
      max-width: 650px;
      line-height: 1.6;
    }

    .sisters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-top: 30px;
    }

    .sister {
      border: 0;
      border-radius: 22px;
      padding: 22px 15px;
      font-size: 20px;
      font-weight: 700;
      color: #c2185b;
      background: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(150, 50, 80, 0.13);
      transition: all 0.3s ease;
    }

    .sister:hover {
      transform: translateY(-7px) scale(1.03);
      background: #fff;
      box-shadow: 0 15px 30px rgba(194, 24, 91, 0.22);
    }

    .sister:active {
      transform: scale(0.96);
    }

    .message-box {
      display: none;
      margin: 40px auto 0;
      max-width: 750px;
      padding: 35px 28px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 28px;
      box-shadow: 0 15px 40px rgba(120, 30, 60, 0.18);
      border: 2px solid #ffd2df;
      animation: fadeIn 0.5s ease;
    }

    .message-box h2 {
      color: #c2185b;
      margin: 0 0 18px;
      font-size: 32px;
    }

    .message-box p {
      font-size: 19px;
      line-height: 1.8;
      margin: 0;
      color: #63343f;
    }

    .close-btn {
      margin-top: 25px;
      padding: 10px 22px;
      border: 0;
      border-radius: 25px;
      background: #c2185b;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .footer {
      margin-top: 45px;
      font-size: 16px;
      line-height: 1.8;
      color: #8a4b58;
    }

    .heart {
      color: #e91e63;
    }

    .floating-heart {
      position: fixed;
      bottom: -30px;
      font-size: 25px;
      animation: floatUp 7s linear forwards;
      opacity: 0.7;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }
    }

    @keyframes floatUp {
      from {
        transform: translateY(0);
        opacity: 0;
      }

      20% {
        opacity: 0.8;
      }

      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 30px 15px 50px;
      }

      .sisters {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .sister {
        padding: 18px 8px;
        font-size: 17px;
      }

      .message-box {
        padding: 28px 20px;
      }

      .message-box p {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="rakhi">🪷</div>

    <h1>Happy Raksha Bandhan ❤️</h1>

    <p class="subtitle">
      A special little message for some very special sisters.
      <br>
      Click your name and discover your message 💝
    </p>

    <!-- =========================
         SISTER NAMES
    ========================== -->

    <div class="sisters">

      <button class="sister" onclick="showMessage('Nikita')">
        🎀 Nikita
      </button>

      <button class="sister" onclick="showMessage('Purvi')">
        🌸 Purvi
      </button>

      <button class="sister" onclick="showMessage('Kiran')">
        ✨ Kiran
      </button>

      <button class="sister" onclick="showMessage('Seema')">
        🌷 Seema
      </button>

      <button class="sister" onclick="showMessage('Neha')">
        💕 Neha
      </button>

      <button class="sister" onclick="showMessage('Tanisha')">
        🦋 Tanisha
      </button>

      <button class="sister" onclick="showMessage('Bharti')">
        🌹 Bharti
      </button>

      <button class="sister" onclick="showMessage('Heena')">
        💖 Heena
      </button>

      <button class="sister" onclick="showMessage('Diksha')">
        🌼 Diksha
      </button>

      <button class="sister" onclick="showMessage('Manali')">
        🥰 Manali
      </button>

      <button class="sister" onclick="showMessage('Jaya')">
        🌺 Jaya
      </button>

      <button class="sister" onclick="showMessage('Karishma')">
        👑 Karishma
      </button>

      <button class="sister" onclick="showMessage('Swapna')">
        🌙 Swapna
      </button>

      <button class="sister" onclick="showMessage('Sneha')">
        ❤️ Sneha
      </button>

    </div>


    <!-- =========================
         MESSAGE BOX
    ========================== -->

    <div id="messageBox" class="message-box">

      <h2 id="sisterName"></h2>

      <p id="sisterMessage"></p>

      <button class="close-btn" onclick="closeMessage()">
        Close ❤️
      </button>

    </div>


    <div class="footer">
      Made with <span class="heart">❤️</span> and lots of love
      <br>
      For all the wonderful sisters ✨
      <br><br>
      <strong>Happy Raksha Bandhan! 🪢💕</strong>
    </div>

  </div>


  <script>

    // ==========================================
    // PERSONALIZED MESSAGE FOR EVERY SISTER
    // ==========================================

    const messages = {

      Nikita:
        "Dear Nikita, you are one of those beautiful people who make life brighter simply by being around. May your smile always stay bright, your heart always stay happy, and your dreams turn into beautiful realities. Wishing you endless happiness and a very Happy Raksha Bandhan! ❤️",

      Purvi:
        "Dear Purvi, some relationships become precious because of the love, laughter, and memories we share. You are truly special and deserve all the happiness in the world. May every new chapter of your life be filled with beautiful moments. Happy Raksha Bandhan! 🌸",

      Kiran:
        "Dear Kiran, just like your name, may you always be a ray of light in everyone's life. Keep smiling, keep shining, and never stop chasing your dreams. May life give you countless reasons to smile. Wishing you a very Happy Raksha Bandhan! ✨",

      Seema:
        "Dear Seema, your kindness and warmth make you truly special. May your life always be surrounded by love, peace, laughter, and wonderful people. Keep being the beautiful soul that you are. Happy Raksha Bandhan! 🌷",

      Neha:
        "Dear Neha, having a sister like you is nothing less than a blessing. May all your wishes come true and may every day bring you something beautiful. Keep smiling and spreading happiness wherever you go. Happy Raksha Bandhan! 💕",

      Tanisha:
        "Dear Tanisha, may your life always be as colorful and beautiful as a butterfly. Fly high, dream big, and never let anything stop you from becoming the person you want to be. Wishing you lots of love, success, and happiness. Happy Raksha Bandhan! 🦋",

      Bharti:
        "Dear Bharti, your presence makes every family moment a little more special. May your journey ahead be filled with success, laughter, love, and countless unforgettable memories. Stay happy and keep shining. Happy Raksha Bandhan! 🌹",

      Heena:
        "Dear Heena, you have a beautiful heart and a smile that can brighten any day. May life always treat you kindly and give you more happiness than you ever wished for. Stay blessed, stay happy, and keep smiling. Happy Raksha Bandhan! 💖",

      Diksha:
        "Dear Diksha, may every step you take lead you closer to your dreams. May you always have the courage to follow your heart and the strength to overcome every challenge. You deserve all the beautiful things life has to offer. Happy Raksha Bandhan! 🌼",

      Manali:
        "Dear Manali, life becomes more beautiful when it is filled with people who bring joy and warmth, and you are certainly one of them. May your days be filled with laughter, love, adventures, and wonderful memories. Happy Raksha Bandhan! 🥰",

      Jaya:
        "Dear Jaya, may happiness always find its way to you. May you continue to grow, shine, and achieve everything you dream of. Never forget how special and loved you are. Wishing you a beautiful and blessed Raksha Bandhan! 🌺",

      Karishma:
        "Dear Karishma, you truly have a special charm that makes you unforgettable. May you always believe in yourself, reach new heights, and live a life full of love and happiness. Keep shining like the star you are. Happy Raksha Bandhan! 👑",

      Swapna:
        "Dear Swapna, may all your beautiful dreams slowly turn into wonderful realities. May your heart always be peaceful, your smile endless, and your journey full of magical moments. Keep dreaming and keep believing. Happy Raksha Bandhan! 🌙",

      Sneha:
        "Dear Sneha, your name itself means love, and you truly spread that warmth wherever you go. May your life always be surrounded by people who love and appreciate you. Keep smiling, keep loving, and keep shining. Wishing you a very Happy Raksha Bandhan! ❤️"

    };


    // ==========================================
    // SHOW MESSAGE
    // ==========================================

    function showMessage(name) {

      document.getElementById("sisterName").innerHTML =
        "For " + name + " ❤️";

      document.getElementById("sisterMessage").innerHTML =
        messages[name];

      const box = document.getElementById("messageBox");

      box.style.display = "block";

      box.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }


    // ==========================================
    // CLOSE MESSAGE
    // ==========================================

    function closeMessage() {

      document.getElementById("messageBox").style.display = "none";

    }


    // ==========================================
    // FLOATING HEARTS
    // ==========================================

    function createHeart() {

      const heart = document.createElement("div");

      heart.className = "floating-heart";

      const emojis = ["❤️", "💕", "💖", "💗", "🌸", "✨"];

      heart.innerHTML =
        emojis[Math.floor(Math.random() * emojis.length)];

      heart.style.left =
        Math.random() * 100 + "vw";

      heart.style.animationDuration =
        (5 + Math.random() * 5) + "s";

      heart.style.fontSize =
        (15 + Math.random() * 20) + "px";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 10000);
    }

    setInterval(createHeart, 800);

  </script>

</body>
</html>
